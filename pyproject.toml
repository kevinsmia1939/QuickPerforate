[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-quickperforate"
version = "0.1.0"
description = "Parametric decorative perforation workbench for FreeCAD."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

[tool.setuptools]
py-modules = ["QuickPerforate", "QuickPerforateGui"]

[tool.setuptools.packages.find]
include = ["freecad.QuickPerforate*"]
namespaces = true

[tool.setuptools.package-data]
"freecad.QuickPerforate" = ["Resources/Icons/*.svg"]
